stages:
  - build
  - deploy

# Staging Environment
build_staging:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17-alpine
  script:
    - mvn clean install -Dmaven.test.skip=false -Denv=staging hibernate-enhance:enhance
  only:
    - staging
  artifacts:
    name: "gloody-pay--staging-$CI_COMMIT_REF_NAME"
    paths:
      - ./target
    expire_in: 1 day

deploy_staging:
  stage: deploy
  image: alpine:3.20.3
  dependencies:
    - build_staging
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$LIGHTSAIL_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $STAGING_PAY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Stopping Tomcat using shutdown.sh..."
    - ssh -i ~/.ssh/id_rsa ec2-user@$STAGING_PAY_HOST 'sudo /opt/tomcat/bin/shutdown.sh || true'
    - echo "Cleaning up old deployment..."
    - ssh -i ~/.ssh/id_rsa ec2-user@$STAGING_PAY_HOST 'sudo rm -rf /opt/tomcat/webapps/gloody-payroll-staging*'
    - echo "Copying new WAR file..."
    - scp -i ~/.ssh/id_rsa ./target/gloody-payroll-staging.war ec2-user@$STAGING_PAY_HOST:/tmp/
    - echo "Moving WAR file with sudo..."
    - ssh -i ~/.ssh/id_rsa ec2-user@$STAGING_PAY_HOST 'sudo mv /tmp/gloody-payroll-staging.war /opt/tomcat/webapps/'
    - echo "Starting Tomcat using startup.sh..."
    - ssh -i ~/.ssh/id_rsa ec2-user@$STAGING_PAY_HOST 'sudo /opt/tomcat/bin/startup.sh'
  only:
    - staging

