# UAT Environment
build_uat:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17-alpine
  script:
    - mvn clean install -Dmaven.test.skip=false -Denv=uat hibernate-enhance:enhance
  only:
    - uat
  artifacts:
    name: "gloody-pay--uat-$CI_COMMIT_REF_NAME"
    paths:
      - ./target
    expire_in: 1 day

deploy_uat:
  stage: deploy
  image: python:3.9.1
  dependencies:
    - build_uat
  script:
    - pip install awscli
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region eu-west-3
    - aws s3 cp ./target/gloody-payroll-uat.war s3://gloody-back-non-prod/Uat/Versions/gloody-payroll-uat-$CI_PIPELINE_ID.war
    - aws elasticbeanstalk create-application-version --application-name "$AWS_EBS_APP" --version-label gloody-payroll-uat-$CI_PIPELINE_ID --source-bundle S3Bucket=gloody-back-non-prod,S3Key=Uat/Versions/gloody-payroll-uat-$CI_PIPELINE_ID.war
    - aws elasticbeanstalk update-environment --application-name "$AWS_EBS_APP" --environment-name "$AWS_EBS_UAT_PAY_ENV" --version-label gloody-payroll-uat-$CI_PIPELINE_ID
  only:
    - uat

# Prod Environment
build_prod:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17-alpine
  script:
    - mvn clean install -Dmaven.test.skip=false -Denv=prod hibernate-enhance:enhance
  only:
    - main
  artifacts:
    name: "gloody-pay--prod-$CI_COMMIT_REF_NAME"
    paths:
      - ./target
    expire_in: 1 day

deploy_prod:
  stage: deploy
  image: python:3.9.1
  dependencies:
    - build_prod
  script:
    - pip install awscli
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region eu-west-3
    - aws s3 cp ./target/gloody-payroll-prod.war s3://ssii-back/pay/Prod/Versions/gloody-payroll-prod-$CI_PIPELINE_ID.war
    - aws elasticbeanstalk create-application-version --application-name "$AWS_EBS_APP" --version-label gloody-payroll-prod-$CI_PIPELINE_ID --source-bundle S3Bucket=ssii-back,S3Key=pay/Prod/Versions/gloody-payroll-prod-$CI_PIPELINE_ID.war
    - aws elasticbeanstalk update-environment --application-name "$AWS_EBS_APP" --environment-name "$AWS_EBS_ENV_PROD" --version-label gloody-payroll-prod-$CI_PIPELINE_ID
  only:
    - main
  when: manual
