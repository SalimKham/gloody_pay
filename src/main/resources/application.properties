spring.application.name=Gloody Payroll
spring.profiles.active=@spring.profiles.active@
spring.jpa.properties.hibernate.dialect=com.zsoft.gloody.gloodypayroll.configs.CustomDialectResolver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_null_ordering=last
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.allow_update_outside_transaction=true
spring.sql.init.mode=ALWAYS
spring.sql.init.platform=mariadb
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.banner.location=classpath:/static/banner.txt
spring.data.rest.default-media-type=application/json

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# spring & server properties
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css, application/javascript, application/json
server.compression.min-response-size=1024
server.forward-headers-strategy=NATIVE
com.zsoft.gloody.configuration.auth.secret-key=access@password
server.tomcat.max-swallow-size=40MB
server.tomcat.max-http-form-post-size=70

springfox.documentation.swagger-ui.enabled=false

aws.s3.access-key=${AWS_ACCESS_KEY_ID}
# S3 AWSSecretKey
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}