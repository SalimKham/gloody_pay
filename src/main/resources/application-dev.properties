# DEVELOP ENVIRONMENT PROPERTIES
spring.config.activate.on-profile=dev
server.port=8081
spring.datasource.url=jdbc:mariadb://localhost:3306/gloody_payroll?useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.liquibase.contexts=dev

logging.level.com.zsoft.gloody.gloodypayroll=DEBUG
#logging.level.org.springframework.web=DEBUG
#spring.jpa.show-sql=true

# CUSTOM PROPERTIES
com.zsoft.gloody.configuration.jwt.secret=jwt@password
com.zsoft.gloody.configuration.auth.secret-key=access@password

file-store.path=/gloody-uploads
file-store.pay_record_prefix=pay_records

aws.s3.access-key=access-key
# S3 AWSSecretKey
aws.s3.secret-key=secret-key
